<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
</head>
<body>

    <h1>Tic-Tac-Toe</h1>
    <div>
        <label for="player1">Player 1 (X):</label>
        <input type="text" id="player1" value="Player 1">
        
        <label for="player2">Player 2 (O):</label>
        <input type="text" id="player2" value="Player 2">
        
        <!-- Button to start/restart the game[cite: 6] -->
        <button id="start-btn">Start / Restart Game</button>
    </div>

    <br>
    <h2 id="message">Enter names and click Start!</h2>

    <!-- Container for the gameboard -->
    <div id="board"></div>

    <script>
        // Wrapped in an IIFE because we only need a single instance of the gameboard
        const Gameboard = (function() {
            // Store the gameboard as an array inside the object
            let board = ["", "", "", "", "", "", "", "", ""]; 

            const getBoard = () => board;

            const placeMarker = (index, marker) => {
                // Logic that keeps players from playing in spots that are already take
                if (board[index] === "") { 
                    board[index] = marker;
                    return true;
                }
                return false;
            };

            const resetBoard = () => {
                board = ["", "", "", "", "", "", "", "", ""];
            };

            return { getBoard, placeMarker, resetBoard };
        })();

        const Player = (name, marker) => {
            return { name, marker };
        };
        const GameController = (function() {
            let players = [];
            let currentPlayerIndex;
            let gameOver = true;

            const startGame = (player1Name, player2Name) => {
                players = [
                    Player(player1Name, "X"),
                    Player(player2Name, "O")
                ];
                currentPlayerIndex = 0;
                gameOver = false;
                
                Gameboard.resetBoard();
                DisplayController.render();
                DisplayController.updateMessage(`${players[currentPlayerIndex].name}'s turn`);
            };

            const playTurn = (index) => {
                if (gameOver) return;

                const currentPlayer = players[currentPlayerIndex];
                
                // Attempt to place the marker
                if (Gameboard.placeMarker(index, currentPlayer.marker)) {
                    
                    // Logic that checks for all winning 3-in-a-rows[cite: 6].
                    if (checkWin(currentPlayer.marker)) { 
                        gameOver = true;
                        DisplayController.updateMessage(`${currentPlayer.name} wins!`);
                    
                    // Logic that checks for ties[cite: 6].
                    } else if (checkTie()) { 
                        gameOver = true;
                        DisplayController.updateMessage("It's a tie!");
                    
                    } else {
                        // Switch turns if no win or tie
                        currentPlayerIndex = currentPlayerIndex === 0 ? 1 : 0;
                        DisplayController.updateMessage(`${players[currentPlayerIndex].name}'s turn`);
                    }
                    
                    // Update the display after the turn
                    DisplayController.render();
                }
            };

            const checkWin = (marker) => {
                const board = Gameboard.getBoard();
                const winPatterns = [
                    [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
                    [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
                    [0, 4, 8], [2, 4, 6]             // Diagonals
                ];
                return winPatterns.some(pattern => 
                    pattern.every(index => board[index] === marker)
                );
            };

            const checkTie = () => {
                const board = Gameboard.getBoard();
                return board.every(cell => cell !== "");
            };

            return { startGame, playTurn };
        })();


        const DisplayController = (function() {
            const boardDiv = document.getElementById("board");
            const messageDiv = document.getElementById("message");
            const startBtn = document.getElementById("start-btn");
            const p1Input = document.getElementById("player1");
            const p2Input = document.getElementById("player2");

            const init = () => {
                // Create the 9 squares for the board
                for (let i = 0; i < 9; i++) {
                    const squareBtn = document.createElement("button");
                    squareBtn.dataset.index = i;
                    
                    // Allow players to add marks to a specific spot by interacting with DOM elements[cite: 6].
                    squareBtn.addEventListener("click", (e) => {
                        GameController.playTurn(e.target.dataset.index);
                    });
                    
                    boardDiv.appendChild(squareBtn);
                    
                    if ((i + 1) % 3 === 0) {
                        boardDiv.appendChild(document.createElement("br"));
                    }
                }

                startBtn.addEventListener("click", () => {
                    const p1Name = p1Input.value || "Player 1";
                    const p2Name = p2Input.value || "Player 2";
                    GameController.startGame(p1Name, p2Name);
                });
            };
            const render = () => {
                const board = Gameboard.getBoard();
            
                const buttons = Array.from(boardDiv.children).filter(el => el.tagName === 'BUTTON');
                
                for (let i = 0; i < 9; i++) {
                    buttons[i].textContent = board[i] || "-"; 
                }
            };

            const updateMessage = (msg) => {
                messageDiv.textContent = msg;
            };

            return { init, render, updateMessage };
        })();

        DisplayController.init();
    </script>
</body>
</html>
